# php-baremetal fork: build the simulator image (Dockerfile.php-baremetal) and
# publish it to GHCR as ghcr.io/php-baremetal/php-baremetal-sim.
#
# Started by hand (Actions → "php-baremetal: image" → Run workflow), or by
# pushing a tag sim-v*. Needs:
#   - secret PHPBM_READ_TOKEN: a fine-grained token with Contents: read on
#     php-baremetal/phpbm (private), to stage the phpbm CLI into the image;
#   - a Release of php-baremetal/php-baremetal-sim-qemu carrying the libqemu
#     .so files and ROMs (its workflow "php-baremetal: libqemu release").
name: "php-baremetal: image"

on:
  workflow_dispatch:
    inputs:
      qemu_release:
        description: "php-baremetal-sim-qemu release tag with the libqemu assets"
        required: true
        default: "qemu-98580369"
      phpbm_ref:
        description: "php-baremetal/phpbm ref to ship (branch, tag or sha)"
        required: true
        default: "master"
  push:
    tags: ["sim-v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: php-baremetal-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/php-baremetal/php-baremetal-sim
  QEMU_RELEASE: ${{ inputs.qemu_release || 'qemu-98580369' }}
  PHPBM_REF: ${{ inputs.phpbm_ref || 'master' }}

jobs:
  image:
    if: github.repository == 'php-baremetal/php-baremetal-sim'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The image is ~9 GB (phpbm's ESP-IDF toolchain is ~6 GB): the runner's
      # free space is not enough without dropping the preinstalled SDKs.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Checkout simulator
        uses: actions/checkout@v4

      - name: Checkout phpbm (private)
        uses: actions/checkout@v4
        with:
          repository: php-baremetal/phpbm
          ref: ${{ env.PHPBM_REF }}
          token: ${{ secrets.PHPBM_READ_TOKEN }}
          path: .phpbm-src

      - name: PHP + Composer for phpbm's vendor/
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2

      - name: Stage phpbm into prebuilt/phpbm
        run: |
          set -euo pipefail
          composer install --working-dir=.phpbm-src --no-interaction --no-progress --prefer-dist
          mkdir -p prebuilt/phpbm
          rsync -a --copy-links --delete \
            --include='/app/***' --include='/bootstrap/***' --include='/config/***' --include='/vendor/***' \
            --include='/phpbm' --include='/composer.json' --include='/composer.lock' --exclude='*' \
            .phpbm-src/ prebuilt/phpbm/
          echo "phpbm $(git -C .phpbm-src rev-parse --short HEAD) staged ($(du -sh prebuilt/phpbm | cut -f1))"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.php-baremetal
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            QEMU_RELEASE_URL=https://github.com/php-baremetal/php-baremetal-sim-qemu/releases/download/${{ env.QEMU_RELEASE }}
            VITE_SOURCE_URL=https://github.com/php-baremetal/php-baremetal-sim/tree/${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "### ${IMAGE}"
            echo
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/; s/$/`/'
            echo
            echo "Source offered by the site: https://github.com/php-baremetal/php-baremetal-sim/tree/${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
